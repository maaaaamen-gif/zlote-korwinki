services:
  - type: web
    name: zlote-korwinki
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/categories
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: zlote_korwinki
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
